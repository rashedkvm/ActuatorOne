applications:
  - name: actuator-one-binary
    stack: tanzucflinuxfs1
    memory: 1G
    random-route: true
    buildpacks:
      - binary_buildpack
    path: target/native
    command: ./actone
    health-check-type: http
    health-check-http-endpoint: /actuator/health
    env:
      ACTONE_ENV_ENABLED: 'false'
